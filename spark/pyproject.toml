[project]
name = "port-congestion-spark"
version = "0.1.0"
description = "Spark jobs: shared cleaning and feature code, live streaming job, batch analytics, training"
requires-python = ">=3.12"
dependencies = [
    # Keep pyspark equal to SPARK_VERSION in versions.env (spark/tests/test_versions.py checks it).
    "pyspark==4.2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=9.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
