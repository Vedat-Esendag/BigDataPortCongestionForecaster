[project]
name = "port-congestion-api"
version = "0.1.0"
description = "Stateless FastAPI web tier: REST and WebSocket push for the dashboard (F10)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "redis>=8.1",
    "cassandra-driver>=3.30",
    "pyyaml>=6.0",
    "prometheus-client>=0.26",
]

[dependency-groups]
dev = ["pytest>=9.0", "httpx2>=2.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
