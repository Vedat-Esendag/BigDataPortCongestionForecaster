[project]
name = "ais-producer"
version = "0.1.0"
description = "aisstream.io WebSocket to Kafka (Avro) producer"
requires-python = ">=3.12"
dependencies = [
    "websockets>=17.0",
    "confluent-kafka[avro,schemaregistry]>=2.16",
    "pyyaml>=6.0",
    "prometheus-client>=0.26",
]

[dependency-groups]
dev = ["pytest>=9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ais_producer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
