name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv has no floating @v10 major tag; pin a real release tag
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Lint (ruff)
        run: make lint
      - name: Tests (pytest, Spark tests included)
        run: make test

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: services/dashboard/.nvmrc
          cache: npm
          cache-dependency-path: services/dashboard/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    name: Compose file validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f infra/docker-compose.yml --profile '*' config --quiet
