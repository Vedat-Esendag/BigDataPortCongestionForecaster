# Redpanda Console: a browser UI for topics, messages, schemas and connectors.
# http://localhost:8085
kafka:
  brokers:
    - kafka:29092
  schemaRegistry:
    enabled: true
    urls:
      - http://schema-registry:8081

kafkaConnect:
  enabled: true
  clusters:
    - name: connect
      url: http://connect:8083
