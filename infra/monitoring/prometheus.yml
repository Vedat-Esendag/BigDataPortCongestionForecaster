# Prometheus scrape config for the docker compose monitoring profile.
# On Kubernetes the same targets are scraped through ServiceMonitors (see infra/k8s/README.md).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Consumer group lag per group and topic, and message offsets per topic.
  # Covers the Kafka Connect sinks and ksqlDB. Spark Structured Streaming does not commit
  # offsets to Kafka, so its lag comes from the Spark job below.
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # Rate and age of the live AIS feed
  - job_name: ais-producer
    static_configs:
      - targets: ["ais-producer:9100"]

  - job_name: api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]

  # Driver of the live job, available while `make spark-live` is running
  - job_name: spark-live
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["spark:4040"]
