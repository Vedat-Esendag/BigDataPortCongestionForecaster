# Kafka, one broker in KRaft mode. Only what it needs to start: no topics, no persistent storage
# (data is lost when the pod restarts). Image tag repeats CP_VERSION from versions.env.
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 29092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  replicas: 1
  strategy:
    type: Recreate # never two brokers with the same id at once
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      automountServiceAccountToken: false # nothing here talks to the Kubernetes API
      # Without this Kubernetes injects KAFKA_PORT=tcp://... for the Service above, and the
      # Confluent image reads every KAFKA_* variable as broker config.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:8.4.0
          ports:
            - containerPort: 29092
              name: plaintext
          env:
            - name: CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk # any 22-character base64 id
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:29093
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:29092,CONTROLLER://localhost:29093
            # Full DNS name, so clients in other namespaces can follow it too (`kafka` alone
            # only resolves inside bd-gr-05).
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka.bd-gr-05.svc.cluster.local:29092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            # Kafka's internal topics default to 3 copies, which a single broker cannot hold.
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_HEAP_OPTS
              value: -Xms512m -Xmx1g
          readinessProbe:
            tcpSocket:
              port: plaintext
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: plaintext
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              cpu: "1" # shared node: cap us so we cannot starve other groups
              memory: 2Gi
