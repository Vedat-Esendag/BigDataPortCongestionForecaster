# Single Kafka broker in KRaft mode, the same setup as the compose `kafka` service. Image tag
# repeats CP_VERSION from versions.env.
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 29092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      automountServiceAccountToken: false # nothing here talks to the Kubernetes API
      # Without this Kubernetes injects KAFKA_PORT=tcp://... for the Service above, and the
      # Confluent image reads every KAFKA_* variable as broker config.
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000 # appuser in the Confluent images
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:8.4.0
          ports:
            - containerPort: 29092
              name: plaintext
            - containerPort: 29093
              name: controller
          env:
            - name: CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk # fixed so restarts reuse the data
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:29093
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:29092,CONTROLLER://localhost:29093
            # Full DNS name, so clients in other namespaces can follow it too (`kafka` alone
            # only resolves inside bd-gr-05).
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka.bd-gr-05.svc.cluster.local:29092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false" # topics come from kafka-topics.yaml
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data/logs # a subfolder, so the volume root may hold other files
            - name: KAFKA_HEAP_OPTS
              value: -Xms512m -Xmx1g
          readinessProbe:
            tcpSocket:
              port: plaintext
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: plaintext
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
