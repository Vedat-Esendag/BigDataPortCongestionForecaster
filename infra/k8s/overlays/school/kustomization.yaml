# The school cluster: our namespace and everything specific to that cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bd-gr-05

labels:
  - pairs:
      env: school
    includeTemplates: true

resources:
  - ../../base

# Our own images, public on ghcr.io (no pull secret), linux/amd64, pushed with
# `make images-push` and tagged with the git commit they were built from. These apply to apps/
# (kafka-connect, ais-producer), which this overlay does not list yet, so today they change
# nothing in the render. spark-jobs is mapped in infra/k8s/spark/school/image.
images:
  - name: pf/ais-producer
    newName: ghcr.io/vedat-esendag/pf/ais-producer
    newTag: dede587
  - name: pf/kafka-connect
    newName: ghcr.io/vedat-esendag/pf/kafka-connect
    newTag: dede587

# Storage class for every volume claim. hostpath-custom is the cluster's default today
# (cluster/cluster_setup.md), so this only makes the choice explicit. The base leaves it out so
# other clusters (kind locally) use their own default. The disk is on the node itself: the data
# survives pod restarts, but not the loss of the node.
patches:
  - target:
      kind: StatefulSet
      name: hdfs-.*|kafka|cassandra
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: hostpath-custom
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: hostpath-custom
