# The school cluster: our namespace and everything specific to that cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bd-gr-05

labels:
  - pairs:
      env: school
    includeTemplates: true

resources:
  - ../../base

# Image registry for our own images (kafka-connect, ais-producer, spark-jobs, web): not chosen
# yet. When it is, map each image here, for example:
#
# images:
#   - name: pf/ais-producer
#     newName: <registry>/pf/ais-producer
#     newTag: <git-sha>

# Storage class: the school cluster's is hostpath-custom. The base leaves it out so other clusters
# use their default. Covers every volume claim of the HDFS StatefulSets.
patches:
  - target:
      kind: StatefulSet
      name: hdfs-.*
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: hostpath-custom
