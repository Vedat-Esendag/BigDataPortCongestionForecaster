# The school cluster: our namespace and everything specific to that cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bd-gr-05

labels:
  - pairs:
      env: school
    includeTemplates: true

resources:
  - ../../base

# Image registry for our own images (kafka-connect, ais-producer, spark-jobs, web): not chosen
# yet. When it is, map each image here, for example:
#
# images:
#   - name: pf/ais-producer
#     newName: <registry>/pf/ais-producer
#     newTag: <git-sha>

# Storage class for every volume claim. hostpath-custom is the cluster's default today
# (cluster/cluster_setup.md), so this only makes the choice explicit. The base leaves it out so
# other clusters (kind locally) use their own default. The disk is on the node itself: the data
# survives pod restarts, but not the loss of the node.
patches:
  - target:
      kind: StatefulSet
      name: hdfs-.*|kafka|cassandra
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: hostpath-custom
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: hostpath-custom
