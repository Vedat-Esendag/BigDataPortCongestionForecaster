# spark/jobs/smoke_count.py: counts the AIS fixture inside the image. The driver log shows
# "rows 20", the master URL and the number of executors.
apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-count
  labels:
    spark-job: smoke-count
spec:
  backoffLimit: 0 # a failed submit must not start more drivers
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        spark-job: smoke-count
    spec:
      serviceAccountName: spark
      restartPolicy: Never
      securityContext: # the image says USER spark by name; Kubernetes needs the number
        runAsNonRoot: true
        runAsUser: 185
        runAsGroup: 185
      containers:
        - name: submit
          image: spark-image
          imagePullPolicy: Never
          command: [/opt/spark/bin/spark-submit]
          args:
            - --name
            - smoke-count
            - --conf
            - spark.kubernetes.driver.label.spark-job=smoke-count
            - --conf
            - spark.kubernetes.executor.label.spark-job=smoke-count
            - local:///opt/app/spark/jobs/smoke_count.py
          env:
            - name: SPARK_CONF_DIR
              value: /opt/spark/conf-local
          volumeMounts:
            - name: spark-conf
              mountPath: /opt/spark/conf-local
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: spark-conf
          configMap:
            name: spark-local-conf
