# spark-submit defaults for the local OrbStack cluster, shared by every Job in this overlay.
# Sized for a laptop: each driver and executor pod asks for 512m heap (+384m overhead) and 0.25 CPU.

# Submit from inside the cluster, in cluster mode: spark-submit creates a driver pod, and the
# driver creates the executor pods with the "spark" service account (base/spark).
spark.master                                        k8s://https://kubernetes.default.svc:443
spark.submit.deployMode                             cluster
spark.kubernetes.namespace                          bd-gr-05
spark.kubernetes.authenticate.driver.serviceAccountName spark

# Locally built image, never pulled. Keep equal to images: in kustomization.yaml.
spark.kubernetes.container.image                    portcongestion/spark:4.2.0
spark.kubernetes.container.image.pullPolicy         Never

spark.driver.memory                                 512m
spark.executor.memory                               512m
spark.executor.instances                            2
spark.executor.cores                                1
spark.kubernetes.driver.request.cores               250m
spark.kubernetes.driver.limit.cores                 1
spark.kubernetes.executor.request.cores             250m
spark.kubernetes.executor.limit.cores               1

# Spark 4.2 also creates a NetworkPolicy per app, which the "spark" Role (base/spark) may not
# create. Skip that step here instead of widening the Role; on a laptop it protects nothing.
spark.kubernetes.driver.pod.excludedFeatureSteps    org.apache.spark.deploy.k8s.features.NetworkPolicyFeatureStep

# OrbStack has no HDFS, but when a job here writes to one, write a single copy of each block
# like the compose stack and the school cluster (dfs.replication 1).
spark.hadoop.dfs.replication                        1

# Scratch space as on the school cluster (#22, infra/k8s/spark/school/spark-defaults.conf): one
# on-demand claim per driver and executor for Spark's temp and shuffle files, owned by the driver
# pod. The storage class is kind's default, "standard" (local-path). It must be named: Spark creates
# an on-demand claim only when both storageClass and sizeLimit are set, and otherwise leaves the
# pod waiting for a claim that never comes.
spark.kubernetes.driver.volumes.persistentVolumeClaim.spark-local-dir-1.options.claimName     OnDemand
spark.kubernetes.driver.volumes.persistentVolumeClaim.spark-local-dir-1.options.storageClass  standard
spark.kubernetes.driver.volumes.persistentVolumeClaim.spark-local-dir-1.options.sizeLimit     5Gi
spark.kubernetes.driver.volumes.persistentVolumeClaim.spark-local-dir-1.mount.path            /spark-local
spark.kubernetes.driver.volumes.persistentVolumeClaim.spark-local-dir-1.mount.readOnly        false
spark.kubernetes.executor.volumes.persistentVolumeClaim.spark-local-dir-1.options.claimName   OnDemand
spark.kubernetes.executor.volumes.persistentVolumeClaim.spark-local-dir-1.options.storageClass standard
spark.kubernetes.executor.volumes.persistentVolumeClaim.spark-local-dir-1.options.sizeLimit   5Gi
spark.kubernetes.executor.volumes.persistentVolumeClaim.spark-local-dir-1.mount.path          /spark-local
spark.kubernetes.executor.volumes.persistentVolumeClaim.spark-local-dir-1.mount.readOnly      false
spark.kubernetes.driver.ownPersistentVolumeClaim    true
spark.kubernetes.driver.reusePersistentVolumeClaim  true
spark.driver.defaultJavaOptions                     -Djava.io.tmpdir=/spark-local
spark.executor.defaultJavaOptions                   -Djava.io.tmpdir=/spark-local
spark.kubernetes.driverEnv.TMPDIR                   /spark-local
spark.executorEnv.TMPDIR                            /spark-local

# Start the work only once both executors are up, so runs are repeatable.
spark.scheduler.minRegisteredResourcesRatio         1.0
spark.scheduler.maxRegisteredResourcesWaitingTime   120s
