# HDFS, one namenode and one datanode, empty: no folders are created and nothing is stored
# persistently (the namenode formats itself on every start). Image tag repeats HADOOP_VERSION.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hadoop-config
data:
  # The image turns FILE.XML_key=value variables into Hadoop config files.
  CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020
  HDFS-SITE.XML_dfs.namenode.rpc-address: namenode:8020
  # `namenode` resolves to the Service address, which the pod itself cannot bind to.
  HDFS-SITE.XML_dfs.namenode.rpc-bind-host: 0.0.0.0
  HDFS-SITE.XML_dfs.namenode.http-bind-host: 0.0.0.0
  # Pods have no reverse DNS entry, so the namenode would reject the datanode without this.
  HDFS-SITE.XML_dfs.namenode.datanode.registration.ip-hostname-check: "false"
  # Under /tmp because the image runs as the `hadoop` user, who cannot create /hadoop.
  HDFS-SITE.XML_dfs.namenode.name.dir: /tmp/hadoop/dfs/name
  HDFS-SITE.XML_dfs.datanode.data.dir: /tmp/hadoop/dfs/data
  HDFS-SITE.XML_dfs.replication: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: namenode
spec:
  selector:
    app: namenode
  ports:
    - name: rpc
      port: 8020
    - name: http
      port: 9870 # web UI
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: namenode
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: namenode
  template:
    metadata:
      labels:
        app: namenode
    spec:
      automountServiceAccountToken: false # nothing here talks to the Kubernetes API
      enableServiceLinks: false
      containers:
        - name: namenode
          image: apache/hadoop:3.5.0
          command: ["hdfs", "namenode"]
          envFrom:
            - configMapRef:
                name: hadoop-config
          env:
            - name: ENSURE_NAMENODE_DIR # formats the namenode when the folder is missing
              value: /tmp/hadoop/dfs/name
          ports:
            - containerPort: 8020
              name: rpc
            - containerPort: 9870
              name: http
          readinessProbe:
            tcpSocket:
              port: rpc
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: rpc
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1" # shared node: cap us so we cannot starve other groups
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datanode
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: datanode
  template:
    metadata:
      labels:
        app: datanode
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: datanode
          image: apache/hadoop:3.5.0
          command: ["hdfs", "datanode"] # keeps retrying until the namenode is up
          envFrom:
            - configMapRef:
                name: hadoop-config
          ports:
            - containerPort: 9866
              name: data
          readinessProbe:
            tcpSocket:
              port: data
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: data
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1" # shared node: cap us so we cannot starve other groups
              memory: 1Gi
