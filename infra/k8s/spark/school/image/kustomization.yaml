# The Spark image for everything in ../ and ../one-off, in one place. Both list this component.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# >>> IMAGE: public on ghcr.io (no pull secret), linux/amd64, pushed with `make images-push`.
# The tag is the git commit it was built from (dede587, digest
# sha256:2fb209fedef714bc58ddc2d4299f6c9628660ccb9a8d26bbef2c693cfc14d748). To move to a new
# build, push it and change newTag here; the replacements copy it to the executors.
images:
  - name: spark-jobs
    newName: ghcr.io/vedat-esendag/spark-jobs
    newTag: dede587
# <<< IMAGE
