# One-off Jobs for the school cluster: the smoke job, the test sender, the lake check, the
# scratch-space check, and the DMA loader and cleaning job (#10).
# Kept out of ../ on purpose, so deploying ../ never runs them (send-fixtures would put test rows
# into the real ais.position and ais.static topics). Apply one at a time, by hand:
#   kubectl apply -k infra/k8s/spark/school/one-off -l one-off=<name>
# Needs the settings ConfigMaps from ../. How to use: ../../README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bd-gr-05

labels:
  - pairs:
      app.kubernetes.io/part-of: port-forecaster
      env: school
      layer: spark-jobs
    includeTemplates: true

resources:
  - job-smoke-count.yaml
  - job-send-fixtures.yaml
  - job-lake-check.yaml
  - job-scratch-check.yaml
  - job-load-dma.yaml
  - job-clean-dma.yaml

components:
  - ../image # the IMAGE setting, shared with ../

# The executors of the cluster-mode Jobs run the same image as their driver (see ../kustomization.yaml).
replacements:
  - source:
      kind: Job
      name: smoke-count
      fieldPath: spec.template.spec.containers.[name=submit].image
    targets:
      - select:
          kind: Job
          name: smoke-count
        fieldPaths:
          - spec.template.spec.containers.[name=submit].env.[name=SPARK_IMAGE].value
      - select:
          kind: Job
          name: scratch-check
        fieldPaths:
          - spec.template.spec.containers.[name=submit].env.[name=SPARK_IMAGE].value
      - select:
          kind: Job
          name: clean-dma
        fieldPaths:
          - spec.template.spec.containers.[name=submit].env.[name=SPARK_IMAGE].value
