# spark-submit defaults for the school cluster (namespace bd-gr-05, one shared amd64 node),
# shared by every Spark pod in this folder. Addresses of Kafka, Schema Registry and HDFS are in
# school.env. The image is not set here: each pod passes its own image to its executors
# (--conf spark.kubernetes.container.image=$(SPARK_IMAGE), filled in by the kustomizations).

# Cluster mode by default: spark-submit creates a driver pod, which creates the executor pods
# with the "spark" service account (base/spark). The recorders override this with client mode.
spark.master                                        k8s://https://kubernetes.default.svc:443
spark.submit.deployMode                             cluster
spark.kubernetes.namespace                          bd-gr-05
spark.kubernetes.authenticate.driver.serviceAccountName spark
spark.kubernetes.container.image.pullPolicy         IfNotPresent

# Small, because the node is shared with other groups: 512m heap (+384m overhead) and a quarter
# CPU per pod, one executor unless a job asks for more.
spark.driver.memory                                 512m
spark.executor.memory                               512m
spark.executor.instances                            1
spark.executor.cores                                1
spark.kubernetes.driver.request.cores               250m
spark.kubernetes.driver.limit.cores                 1
spark.kubernetes.executor.request.cores             250m
spark.kubernetes.executor.limit.cores               1

# >>> NETWORKPOLICY (open question, Gerardas): in cluster mode Spark 4.2 also creates a
# NetworkPolicy for each app, and the "spark" Role (base/spark) may not create NetworkPolicies.
# This line skips that step. Delete it once the Role gets networkpolicies.
spark.kubernetes.driver.pod.excludedFeatureSteps    org.apache.spark.deploy.k8s.features.NetworkPolicyFeatureStep
# <<< NETWORKPOLICY

# HDFS on the school cluster has a single datanode: write one copy of each block (the client
# default is 3, which leaves every block under-replicated).
spark.hadoop.dfs.replication                        1

spark.sql.session.timeZone                          UTC

# >>> SCRATCH (#22): Spark's temp and shuffle files go to a volume on the node's large /data disk
# (storage class hostpath-custom), never to the pod's own filesystem on the nearly full root disk.
# A volume named spark-local-dir-* replaces the default emptyDir: Spark sets SPARK_LOCAL_DIRS to
# its mount path. OnDemand makes Spark create one claim per driver and per executor. The driver
# pod owns all of them (ownPersistentVolumeClaim), so they are deleted with the driver pod, and a
# replacement executor reuses the claim of the one it replaces (reusePersistentVolumeClaim).
# The size is not enforced by hostpath-custom; it is the size the claim asks for. Keep both
# storageClass and sizeLimit: without either, Spark creates no claim and the pod never starts.
# Pods that Spark does not create (the recorders, lake-check) mount their own /spark-local.
spark.kubernetes.driver.volumes.persistentVolumeClaim.spark-local-dir-1.options.claimName     OnDemand
spark.kubernetes.driver.volumes.persistentVolumeClaim.spark-local-dir-1.options.storageClass  hostpath-custom
spark.kubernetes.driver.volumes.persistentVolumeClaim.spark-local-dir-1.options.sizeLimit     20Gi
spark.kubernetes.driver.volumes.persistentVolumeClaim.spark-local-dir-1.mount.path            /spark-local
spark.kubernetes.driver.volumes.persistentVolumeClaim.spark-local-dir-1.mount.readOnly        false
spark.kubernetes.executor.volumes.persistentVolumeClaim.spark-local-dir-1.options.claimName   OnDemand
spark.kubernetes.executor.volumes.persistentVolumeClaim.spark-local-dir-1.options.storageClass hostpath-custom
spark.kubernetes.executor.volumes.persistentVolumeClaim.spark-local-dir-1.options.sizeLimit   20Gi
spark.kubernetes.executor.volumes.persistentVolumeClaim.spark-local-dir-1.mount.path          /spark-local
spark.kubernetes.executor.volumes.persistentVolumeClaim.spark-local-dir-1.mount.readOnly      false
spark.kubernetes.driver.ownPersistentVolumeClaim    true
spark.kubernetes.driver.reusePersistentVolumeClaim  true
# Other temp files too: the JVM's java.io.tmpdir and Python's TMPDIR point at the same volume.
# defaultJavaOptions are prepended to a job's own extraJavaOptions, so a job that sets
# -Duser.timezone=UTC keeps this.
spark.driver.defaultJavaOptions                     -Djava.io.tmpdir=/spark-local
spark.executor.defaultJavaOptions                   -Djava.io.tmpdir=/spark-local
spark.kubernetes.driverEnv.TMPDIR                   /spark-local
spark.executorEnv.TMPDIR                            /spark-local
# <<< SCRATCH

# Start the work only once the executors are up, so runs are repeatable.
spark.scheduler.minRegisteredResourcesRatio         1.0
spark.scheduler.maxRegisteredResourcesWaitingTime   120s
