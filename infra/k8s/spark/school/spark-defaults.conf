# spark-submit defaults for the school cluster (namespace bd-gr-05, one shared amd64 node),
# shared by every Spark pod in this folder. Addresses of Kafka, Schema Registry and HDFS are in
# school.env. The image is not set here: each pod passes its own image to its executors
# (--conf spark.kubernetes.container.image=$(SPARK_IMAGE), filled in by the kustomizations).

# Cluster mode by default: spark-submit creates a driver pod, which creates the executor pods
# with the "spark" service account (base/spark). The recorders override this with client mode.
spark.master                                        k8s://https://kubernetes.default.svc:443
spark.submit.deployMode                             cluster
spark.kubernetes.namespace                          bd-gr-05
spark.kubernetes.authenticate.driver.serviceAccountName spark
spark.kubernetes.container.image.pullPolicy         IfNotPresent

# Small, because the node is shared with other groups: 512m heap (+384m overhead) and a quarter
# CPU per pod, one executor unless a job asks for more.
spark.driver.memory                                 512m
spark.executor.memory                               512m
spark.executor.instances                            1
spark.executor.cores                                1
spark.kubernetes.driver.request.cores               250m
spark.kubernetes.driver.limit.cores                 1
spark.kubernetes.executor.request.cores             250m
spark.kubernetes.executor.limit.cores               1

# >>> NETWORKPOLICY (open question, Gerardas): in cluster mode Spark 4.2 also creates a
# NetworkPolicy for each app, and the "spark" Role (base/spark) may not create NetworkPolicies.
# This line skips that step. Delete it once the Role gets networkpolicies.
spark.kubernetes.driver.pod.excludedFeatureSteps    org.apache.spark.deploy.k8s.features.NetworkPolicyFeatureStep
# <<< NETWORKPOLICY

# HDFS on the school cluster has a single datanode: write one copy of each block (the client
# default is 3, which leaves every block under-replicated).
spark.hadoop.dfs.replication                        1

spark.sql.session.timeZone                          UTC

# Start the work only once the executors are up, so runs are repeatable.
spark.scheduler.minRegisteredResourcesRatio         1.0
spark.scheduler.maxRegisteredResourcesWaitingTime   120s
