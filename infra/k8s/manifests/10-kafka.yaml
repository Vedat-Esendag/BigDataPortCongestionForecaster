# Kafka (KRaft) through the Strimzi operator. Needs infra/k8s/helm-values/strimzi-operator.yaml first.
# The bootstrap address inside the cluster is pc-kafka-kafka-bootstrap:9092.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: port-congestion
  labels:
    strimzi.io/cluster: pc-kafka
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 20Gi
        kraftMetadata: shared
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: pc-kafka
  namespace: port-congestion
spec:
  kafka:
    version: 4.4.0
    metadataVersion: 4.4-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      auto.create.topics.enable: false
  entityOperator:
    topicOperator: {}
---
# Topics, same names and partition counts as scripts/create_topics.sh.
