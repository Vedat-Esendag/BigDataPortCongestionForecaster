# Where the FilePulse source reads the DMA daily CSV files (connect/filepulse-dma-source.json reads
# /data/dma/incoming). Fill it from your machine, one unzipped day at a time:
#   kubectl exec deploy/kafka-connect -- mkdir -p /data/dma/incoming
#   kubectl cp data/dma/aisdk-2026-11-05.csv <kafka-connect pod>:/data/dma/incoming/
# One unzipped day is about 4.5 GB, so remove processed files or raise the size.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dma-files
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
