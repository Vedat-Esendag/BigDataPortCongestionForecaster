# Redis settings for the port forecaster. Loaded by deployment.yaml as /etc/redis/redis.conf.
#
# What Redis does in this project: it holds the LATEST state only. One JSON document per ship
# (ship.prediction:<mmsi>) and per port (port.outlook:<port>). Each new result from the Spark live
# job overwrites the previous one. The Redis sink connector writes them (connect/redis-sink.json).
# The API reads them. History lives in Cassandra, raw data in HDFS. See docs/storage.md.
#
# Docker compose mounts this same file (infra/compose.services.yml), so local and cluster Redis
# behave the same. Note: Redis does not allow a comment at the end of a setting line.

# --- Network -------------------------------------------------------------------------------
# Listen on every interface: the pod is only reachable inside our namespace through the
# `redis` Service. Protected mode would refuse those connections because there is no password.
bind * -::*
protected-mode no
port 6379

# --- Live push -----------------------------------------------------------------------------
# The Redis sink can write keys but cannot PUBLISH to pub/sub. So Redis announces every write
# itself: after a write to ship.prediction:219000123 it publishes on the channel
# __keyspace@0__:ship.prediction:219000123. Each API pod subscribes to those channels, reads the
# changed key and pushes it to the dashboards over WebSocket.
#   K = send the keyspace channel (__keyspace@0__:<key>)
#   A = for every kind of command, including JSON.SET
notify-keyspace-events KA

# --- Persistence ---------------------------------------------------------------------------
# Redis keeps everything in memory. Without this, a restart shows an empty map until every
# ship has sent a new position, which can take minutes for a ship at anchor.
# The append-only file (AOF) logs every write to disk, in /data (the PersistentVolumeClaim).
# On start Redis replays it and is back to the state of about one second before the stop.
dir /data
appendonly yes
# Write to disk once a second: at most one second of updates is lost.
appendfsync everysec
# No extra RDB snapshots: the AOF is enough for a few thousand keys.
save ""

# --- Memory --------------------------------------------------------------------------------
# A few thousand ships of about 1 KB each fit easily. The cap stays well under the container's
# 1 GiB limit, because rewriting the AOF forks the process and briefly needs extra memory.
# noeviction: when full, Redis rejects writes (the sink connector logs an error) instead of
# silently dropping ships from the map. A loud failure is easier to notice than a missing ship.
maxmemory 512mb
maxmemory-policy noeviction
