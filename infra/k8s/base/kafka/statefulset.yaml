# Kafka, one broker in KRaft mode. Only what it needs to start: no topics, and no persistent
# volume yet (data is lost when the pod restarts). Image tag repeats CP_VERSION in versions.env.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      automountServiceAccountToken: false # nothing here talks to the Kubernetes API
      # Without this Kubernetes injects KAFKA_PORT=tcp://... for the Service, and the
      # Confluent image reads every KAFKA_* variable as broker config.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # appuser in the Confluent images
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:8.4.0
          ports:
            - containerPort: 9092
              name: kafka
          env:
            - name: CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk # any 22-character base64 id
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            # Kafka's internal topics default to 3 copies, which a single broker cannot hold.
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_HEAP_OPTS
              value: -Xms512m -Xmx1g
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              cpu: "1" # shared node: cap us so we cannot starve other groups
              memory: 2Gi
