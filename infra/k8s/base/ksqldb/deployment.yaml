# ksqlDB server: the quiet-feed and threshold alerts (F13) and the DMA history split (F2).
# The queries themselves are in ksql/*.sql and are created by scripts/run_ksql.py after the
# topics and schemas exist (infra/k8s/local-up.sh does that). ksqlDB keeps them in its command
# topic in Kafka, so a restarted pod runs the same queries again by itself.
# Image tag repeats CP_VERSION.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ksqldb
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ksqldb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ksqldb
    spec:
      automountServiceAccountToken: false # nothing here talks to the Kubernetes API
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # appuser in the Confluent images
      initContainers:
        - name: wait-for-kafka
          image: confluentinc/cp-ksqldb-server:8.4.0
          command: ["bash", "-c", "until (echo > /dev/tcp/kafka/9092) 2>/dev/null; do echo waiting for kafka; sleep 3; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: ksqldb
          image: confluentinc/cp-ksqldb-server:8.4.0
          ports:
            - containerPort: 8088
              name: http
          env:
            - name: KSQL_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: KSQL_LISTENERS
              value: http://0.0.0.0:8088
            - name: KSQL_KSQL_SCHEMA_REGISTRY_URL
              value: http://schema-registry:8081
            # Names ksqlDB's own topics (_confluent-ksql-portcongestion_command_topic holds every
            # query). Fixed, so a new pod finds the queries of the old one. Same as in compose.
            - name: KSQL_KSQL_SERVICE_ID
              value: portcongestion_
            # One broker, so one copy of ksqlDB's internal topics and of the topics its queries
            # create (alerts, ais.history.position, ais.history.static if not made by the script).
            - name: KSQL_KSQL_INTERNAL_TOPIC_REPLICAS
              value: "1"
            - name: KSQL_KSQL_STREAMS_REPLICATION_FACTOR
              value: "1"
            - name: KSQL_HEAP_OPTS
              value: -Xms512m -Xmx1g
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /info
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /info
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              cpu: "1" # shared node: cap us so we cannot starve other groups
              memory: 2Gi
