# Two kinds of pods here (the database and the schema Job), so app.kubernetes.io/name and
# component are set in each file, as in hdfs/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      layer: storage
    includeTemplates: true

resources:
  - service.yaml
  - statefulset.yaml
  - schema-job.yaml
  - ../../../../cassandra # the cassandra-schema ConfigMap, built from cassandra/schema.cql
