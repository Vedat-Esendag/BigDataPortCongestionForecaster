# Cassandra, one node, empty: no keyspaces or tables, and no persistent volume yet (data is lost
# when the pod restarts). Image tag repeats CASSANDRA_VERSION in versions.env.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
spec:
  serviceName: cassandra
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cassandra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cassandra
    spec:
      automountServiceAccountToken: false # nothing here talks to the Kubernetes API
      enableServiceLinks: false
      securityContext:
        # The image starts as root and then switches to `cassandra`; start as it directly.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: cassandra
          image: cassandra:5.0.9
          env:
            # Without these Cassandra sizes its memory from the node (about 1 TB here) and gets
            # killed at the container limit.
            - name: MAX_HEAP_SIZE
              value: 1G
            - name: HEAP_NEWSIZE
              value: 256M
            - name: JVM_EXTRA_OPTS
              value: -XX:MaxDirectMemorySize=512M
          ports:
            - containerPort: 9042
              name: cql
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            tcpSocket:
              port: cql
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: cql
            initialDelaySeconds: 120 # Cassandra takes a while to start
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2" # shared node: cap us so we cannot starve other groups
              memory: 3Gi
