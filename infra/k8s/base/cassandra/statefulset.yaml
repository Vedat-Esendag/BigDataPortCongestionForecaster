# Cassandra, one node, empty: no keyspaces or tables yet. Its data, commit log and saved caches
# are on a persistent volume, so they survive pod restarts. Image tag repeats CASSANDRA_VERSION in
# versions.env.
# Upgrading from the version without a volume: Kubernetes cannot add a volume claim to an existing
# StatefulSet, so delete it first (kubectl delete statefulset cassandra), then apply.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
spec:
  serviceName: cassandra
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cassandra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cassandra
    spec:
      automountServiceAccountToken: false # nothing here talks to the Kubernetes API
      enableServiceLinks: false
      securityContext:
        # The image starts as root and then switches to `cassandra`; start as it directly.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999 # makes the volume writable for the cassandra user
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: cassandra
          image: cassandra:5.0.9
          env:
            # Without these Cassandra sizes its memory from the node (about 1 TB here) and gets
            # killed at the container limit.
            - name: MAX_HEAP_SIZE
              value: 1G
            - name: HEAP_NEWSIZE
              value: 256M
            - name: JVM_EXTRA_OPTS
              value: -XX:MaxDirectMemorySize=512M
          volumeMounts:
            - name: data
              mountPath: /var/lib/cassandra
          ports:
            - containerPort: 9042
              name: cql
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            tcpSocket:
              port: cql
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: cql
            initialDelaySeconds: 120 # Cassandra takes a while to start
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2" # shared node: cap us so we cannot starve other groups
              memory: 3Gi
  # Storage class is set per cluster in the overlay (school: hostpath-custom).
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
