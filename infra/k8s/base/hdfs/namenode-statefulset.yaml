# HDFS namenode. Its metadata (which files exist and where their blocks are) lives on a
# persistent volume, so it is formatted only the first time and survives pod restarts. No
# folders are created yet. Image tag repeats HADOOP_VERSION in versions.env.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hdfs-namenode
  labels:
    app.kubernetes.io/name: hdfs-namenode
    app.kubernetes.io/component: namenode
spec:
  serviceName: hdfs-namenode
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hdfs-namenode
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hdfs-namenode
        app.kubernetes.io/component: namenode
    spec:
      automountServiceAccountToken: false # nothing here talks to the Kubernetes API
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001 # `hadoop` in the image
        runAsGroup: 100
        fsGroup: 100 # makes the volume writable for the hadoop user
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: namenode
          image: apache/hadoop:3.5.0
          # args, not command: command would replace the image's entrypoint, which writes the
          # config files and formats the namenode.
          args: ["hdfs", "namenode"]
          envFrom:
            - configMapRef:
                name: hdfs-config
          env:
            - name: ENSURE_NAMENODE_DIR # formats the namenode when the folder is missing
              value: /hadoop/dfs/name
          volumeMounts:
            - name: name-dir
              mountPath: /hadoop/dfs
          ports:
            - containerPort: 8020
              name: rpc
            - containerPort: 9870
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            tcpSocket:
              port: rpc
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: rpc
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1" # shared node: cap us so we cannot starve other groups
              memory: 1Gi
  # Storage class is set per cluster in the overlay (school: hostpath-custom).
  volumeClaimTemplates:
    - metadata:
        name: name-dir
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi # metadata only, the data itself is on the datanode
