# Confluent Schema Registry, empty: no schemas are registered. Image tag repeats CP_VERSION.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: schema-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schema-registry
    spec:
      automountServiceAccountToken: false # nothing here talks to the Kubernetes API
      enableServiceLinks: false # otherwise SCHEMA_REGISTRY_PORT=tcp://... breaks the image's config
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # appuser in the Confluent images
      initContainers:
        - name: wait-for-kafka
          image: confluentinc/cp-schema-registry:8.4.0
          command: ["bash", "-c", "until (echo > /dev/tcp/kafka/9092) 2>/dev/null; do echo waiting for kafka; sleep 3; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: schema-registry
          image: confluentinc/cp-schema-registry:8.4.0
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: kafka:9092
            # its own storage topic defaults to 3 copies, which a single broker cannot hold
            - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: SCHEMA_REGISTRY_LISTENERS
              value: http://0.0.0.0:8081
            - name: SCHEMA_REGISTRY_HEAP_OPTS
              value: -Xms256m -Xmx512m
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /subjects
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /subjects
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m # shared node: cap us so we cannot starve other groups
              memory: 1Gi
